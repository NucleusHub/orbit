services:
  orbit-server:
    build:
      context: ./server
    restart: unless-stopped
    labels:
      nucleus.managed: "true"
      nucleus.stack: "nucleus"
      nucleus.role: "app-server"
      nucleus.app: "orbit"
      nucleus.depends: "mongo,minio"
    environment:
      MONGODB_URI: mongodb://mongo:27017/nucleus
      PORT: 3003
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-nucleusadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-nucleuschangeme}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost}
      MINIO_BUCKET: ${MINIO_BUCKET:-orbit-uploads}
    volumes:
      - ./server:/app
      - ../../core:/app/core:ro
      - ../../plugins:/app/plugins:ro
      - orbit_server_modules:/app/node_modules
    depends_on:
      mongo:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3003/api/orbit/health',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  orbit-client:
    build:
      context: ./client
    restart: unless-stopped
    labels:
      nucleus.managed: "true"
      nucleus.stack: "nucleus"
      nucleus.role: "app-client"
      nucleus.app: "orbit"
    environment:
      API_TARGET: http://orbit-server:3003
      NUCLEUS_HOST: ${NUCLEUS_HOST:-nucleus.olm-altair.ts.net}
    volumes:
      - ./client/src:/app/src
      - ./client/index.html:/app/index.html
      - ./client/vite.config.js:/app/vite.config.js
      # Locale files for main.js's `import '../locales/en-US.json'` fallback. The
      # baked-in `client/locales` symlink (→ ../locales) dangles in the container
      # because ../locales is outside the ./client build context; mount the dir
      # at the symlink's resolved target (/app/locales → /locales) so Vite can
      # resolve it in dev. (Prod is fine: dist/ is built on the host.)
      - ./locales:/locales:ro
      - ../../core:/app/core:ro
      - ../../plugins:/app/plugins:ro
      # Widget package, so core/AuthGuard's @widgets-core import resolves (Pulse
      # widgets can float in this app). Mirrors the hub. Read-only.
      - ../../widgets:/app/widgets:ro
    depends_on:
      orbit-server:
        condition: service_healthy

volumes:
  orbit_server_modules:
