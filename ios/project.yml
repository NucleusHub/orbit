name: Orbit
options:
  bundleIdPrefix: com.nucleushome
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  NucleusUI:
    url: https://github.com/NucleusHub/nucleus-native-ui
    from: 0.5.0

settings:
  base:
    DEVELOPMENT_TEAM: AJT82US5MR
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: 5.0

targets:
  Orbit:
    type: application
    platform: iOS
    sources:
      - path: Orbit
    dependencies:
      - package: NucleusUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nucleushome.orbit
        PRODUCT_NAME: Orbit
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    info:
      path: Orbit/Info.plist
      properties:
        CFBundleDisplayName: Orbit
        CFBundleLocalizations: [en, cs]
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities: [arm64]
        NSFaceIDUsageDescription: Unlock Orbit when the app lock is on.
        NSCameraUsageDescription: Scan Nucleus QR codes to set up your server or sign in.
        NSPhotoLibraryAddUsageDescription: Save photos and videos from Orbit to your library.
        CFBundleURLTypes:
          - CFBundleURLName: com.nucleushome.orbit
            CFBundleURLSchemes: [com.nucleushome.orbit]
        # Setup files from a server's administrator (.nucleusserver, JSON); Todo declares the type.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Nucleus server setup
            LSHandlerRank: Owner
            LSItemContentTypes: [com.nucleushome.server]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.nucleushome.server
            UTTypeDescription: Nucleus server setup
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [nucleusserver]
        # Opened files arrive as copies, read once on import.
        LSSupportsOpeningDocumentsInPlace: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          # Tailscale names over plain http: the tailnet already encrypts the traffic.
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true

  OrbitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OrbitTests
    dependencies:
      - target: Orbit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Orbit.app/Orbit

  OrbitUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: OrbitUITests
    dependencies:
      - target: Orbit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Orbit

schemes:
  Orbit:
    build:
      targets:
        Orbit: all
        OrbitTests: [test]
        OrbitUITests: [test]
    test:
      targets:
        - OrbitTests
        - OrbitUITests
    run:
      config: Debug
